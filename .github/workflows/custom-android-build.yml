name: Custom Android Build (Travis)

# Builds a personal APK with the resizable widget changes.
# Run it from the Actions tab: "Custom Android Build (Travis)" -> Run workflow.
# The APK installs alongside the F-Droid version as "WHPH Custom".

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize Submodules
        uses: ./.github/actions/setup-repository

      - name: Setup Flutter with FVM
        uses: ./.github/actions/setup-fvm
        with:
          cache-key-suffix: "android"

      - name: Exclude test-only plugins from release builds
        run: fvm flutter config --explicit-package-dependencies

      - name: Install Flutter Dependencies
        uses: ./.github/actions/install-flutter-deps

      - name: Install RPS and generate code
        run: |
          fvm dart pub global activate rps
          rps gen

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Flutter at Java 17
        run: |
          fvm flutter config --jdk-dir "$JAVA_HOME"
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Remove non-Android platforms
        run: |
          cd src
          rm -rf ios linux macos web windows

      - name: Make it a separate app (installs beside the original)
        run: |
          sed -i 's/applicationId = "me.ahmetcetinkaya.whph"/applicationId = "me.ahmetcetinkaya.whph.custom"/' src/android/app/build.gradle
          for f in src/android/app/src/main/res/values*/strings.xml; do
            sed -i -E 's#(<string name="app_name"[^>]*>)[^<]*(</string>)#\1WHPH Custom b${{ github.run_number }}\2#' "$f"
          done
          grep -n "applicationId" src/android/app/build.gradle

      - name: Setup signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f src/android/app/custom-release.p12 ]; then
            echo "Using the permanent signing key"
            STORE=custom-release.p12
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::KEYSTORE_PASSWORD secret not set. Using a one-off key; you will need to uninstall before installing this build."
            STORE=whph-release.keystore
            PASS="customwhph"
            keytool -genkeypair -keystore "src/android/app/$STORE" -alias whph -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=WHPH Custom"
          fi
          cat > src/android/key.properties << EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=whph
          storeFile=$STORE
          EOF

      - name: Build APK
        run: |
          cd src
          fvm flutter build apk --release --build-number=$((10000 + ${{ github.run_number }}))

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whph-custom-apk
          path: src/build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0

      - name: Publish APK as a release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/build/app/outputs/flutter-apk/app-release.apk whph-custom.apk
          gh release create "build-${{ github.run_number }}" whph-custom.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "WHPH Custom build ${{ github.run_number }}" \
            --notes "Install whph-custom.apk on your phone." --latest
